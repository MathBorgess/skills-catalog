<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>motion identity proof</title>
    <!-- motion.mjs proof writes the brand tokens here. The video engine embeds fonts only from custom
         properties in an inline <style>, never from a linked file. -->
    <!-- mi:tokens -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- the proof registers its paused timeline here; the literal line is what the HyperFrames lint looks for -->
    <script>
      window.__timelines = window.__timelines || {};
    </script>
    <script>
      /* mi:plan */
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: var(--mi-bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--mi-bg);
        color: var(--mi-text);
        font-family: var(--mi-font-body);
        font-weight: var(--mi-weight-body);
      }
      #mi-ambient {
        position: absolute;
        left: -20%;
        top: -20%;
        width: 140%;
        height: 140%;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(closest-side at 50% 45%, var(--mi-ambient) 0%, transparent 100%);
      }
      #mi-stage {
        position: absolute;
        inset: 0;
      }
      #mi-block {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #mi-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      #mi-headline {
        font-family: var(--mi-font-display);
        font-weight: var(--mi-weight-display);
        line-height: 1.02;
        letter-spacing: -0.02em;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: baseline;
        column-gap: 0.24em;
      }
      .mi-word {
        display: inline-block;
      }
      #mi-rule {
        background: var(--mi-accent);
        transform-origin: 0% 50%;
      }
      #mi-sub {
        color: var(--mi-sub);
        font-family: var(--mi-font-body);
        font-weight: var(--mi-weight-body);
        line-height: 1.2;
      }
      #mi-signature {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="proof" data-start="0" data-width="1080" data-height="1920" data-duration="8">
      <div id="mi-ambient" aria-hidden="true"></div>
      <div id="mi-stage">
        <div id="mi-block">
          <div id="mi-content">
            <div id="mi-headline"><!-- mi:headline --></div>
            <div id="mi-rule"></div>
            <div id="mi-sub"></div>
          </div>
        </div>
        <svg id="mi-signature" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      </div>
    </div>

    <script>
      (function () {
        "use strict";
        var P = window.MOTION_PROOF;
        function fail(message) {
          if (window.console && console.error) console.error("motion proof: " + message);
          throw new Error(message);
        }
        if (typeof window.gsap === "undefined") fail("GSAP did not load: the render needs network access to cdn.jsdelivr.net.");
        ["enter", "exit", "emphasis", "move"].forEach(function (role) {
          if (typeof gsap.parseEase(P.eases[role]) !== "function") fail("the " + role + " ease " + JSON.stringify(P.eases[role]) + " is not a GSAP ease.");
        });

        var AMBIENT = { subtle: { period: 9, shift: 4, scale: 1.08, opacity: 0.22 }, lively: { period: 5, shift: 8, scale: 1.16, opacity: 0.38 } };

        var root = document.getElementById("root");
        var block = document.getElementById("mi-block");
        var content = document.getElementById("mi-content");
        var head = document.getElementById("mi-headline");
        var rule = document.getElementById("mi-rule");
        var sub = document.getElementById("mi-sub");
        var svg = document.getElementById("mi-signature");
        var words = Array.prototype.slice.call(head.querySelectorAll(".mi-word"));
        var aw = words[P.accentIndex];
        var safe = P.safe;
        var sw = safe[2] - safe[0];
        var sh = safe[3] - safe[1];
        var portrait = P.orientation === "portrait";
        var meter = document.createElement("canvas").getContext("2d");

        // The ink of a word (its glyphs, not its line box), in the coordinates of #mi-block.
        function ink(el) {
          var cs = getComputedStyle(el);
          meter.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
          if ("letterSpacing" in meter) meter.letterSpacing = cs.letterSpacing;
          var m = meter.measureText(el.textContent);
          var base = el.offsetTop + (el.offsetHeight - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2 + m.fontBoundingBoxAscent;
          return { l: el.offsetLeft - m.actualBoundingBoxLeft, r: el.offsetLeft + m.actualBoundingBoxRight, t: base - m.actualBoundingBoxAscent, b: base + m.actualBoundingBoxDescent };
        }

        // The emphasized word grows to P.emphasisReach (the peak, times the overshoot of the emphasis ease),
        // from its centre. Give it that room: a margin on each side where a word of its line, or a word of
        // the line above or below, would be touched. A word space stays readable at the peak (0.16em, about
        // half the gap at rest); a line keeps the headline's own tight leading (0.04em). Returns the grown ink.
        function reserve(size) {
          var clearX = size * 0.16;
          var clearY = size * 0.04;
          var R = P.emphasisReach;
          var add = { l: 0, r: 0, t: 0, b: 0 };
          var g;
          aw.style.margin = "0px";
          for (var pass = 0; pass < 3; pass++) {
            var a = ink(aw);
            var cx = aw.offsetLeft + aw.offsetWidth / 2;
            var cy = aw.offsetTop + aw.offsetHeight / 2;
            g = { l: cx - R * (cx - a.l), r: cx + R * (a.r - cx), t: cy - R * (cy - a.t), b: cy + R * (a.b - cy) };
            var need = { l: 0, r: 0, t: 0, b: 0 };
            words.forEach(function (w) {
              if (w === aw) return;
              var k = ink(w);
              if (Math.abs(w.offsetTop - aw.offsetTop) < 1) {
                if (w.offsetLeft < aw.offsetLeft) need.l = Math.max(need.l, k.r + clearX - g.l);
                else need.r = Math.max(need.r, g.r + clearX - k.l);
              } else if (k.r > g.l && k.l < g.r) {
                if (w.offsetTop < aw.offsetTop) need.t = Math.max(need.t, k.b + clearY - g.t);
                else need.b = Math.max(need.b, g.b + clearY - k.t);
              }
            });
            if (need.l <= 0.5 && need.r <= 0.5 && need.t <= 0.5 && need.b <= 0.5) break;
            ["l", "r", "t", "b"].forEach(function (s) { add[s] += Math.max(0, Math.ceil(need[s])); });
            aw.style.margin = add.t + "px " + add.r + "px " + add.b + "px " + add.l + "px";
          }
          return g;
        }

        function layout() {
          block.style.left = safe[0] + "px";
          block.style.top = safe[1] + "px";
          block.style.width = sw + "px";
          block.style.height = sh + "px";
          svg.setAttribute("viewBox", "0 0 " + P.width + " " + P.height);
          // Big words: the largest size at which every word fits the safe width, the headline half its height,
          // and the emphasized word, at the height of its emphasis, the safe width too.
          var size = portrait ? 236 : 212;
          var floor = portrait ? 96 : 80;
          for (;;) {
            head.style.fontSize = size + "px";
            var grown = reserve(size);
            var widest = words.reduce(function (w, el) { return Math.max(w, el.offsetWidth); }, 0);
            var room = grown.l >= 0 && grown.r <= sw;
            if ((widest <= sw * 0.94 && head.offsetHeight <= sh * 0.5 && room) || size <= floor) break;
            size -= 4;
          }
          rule.style.width = Math.round(Math.min(sw * 0.5, head.offsetWidth * 0.6)) + "px";
          rule.style.height = Math.max(8, Math.round(size * 0.06)) + "px";
          rule.style.borderRadius = Math.max(4, Math.round(size * 0.03)) + "px";
          rule.style.marginTop = Math.round(size * 0.28) + "px";
          if (P.sub) {
            sub.textContent = P.sub;
            sub.style.fontSize = Math.max(portrait ? 56 : 44, Math.round(size * 0.26)) + "px";
            sub.style.marginTop = Math.round(size * 0.22) + "px";
            sub.style.maxWidth = Math.round(sw * 0.9) + "px";
          } else {
            sub.style.display = "none";
          }
          return size;
        }

        function ambient(tl) {
          var level = AMBIENT[P.ambient];
          var el = document.getElementById("mi-ambient");
          if (!level) return;
          el.style.opacity = String(level.opacity);
          var cycles = Math.max(1, Math.round(P.total / level.period));
          tl.fromTo(el, { xPercent: -level.shift, yPercent: -level.shift / 2, scale: 1 }, {
            xPercent: level.shift, yPercent: level.shift / 2, scale: level.scale,
            duration: P.total / cycles, ease: "sine.inOut", yoyo: true, repeat: cycles - 1
          }, 0);
        }

        // SIGNATURE: the brand's own move, written for this proof by motion.mjs proof --signature <file>.
        // Add tweens to tl only, between `at` and `at + dur`. ctx.svg is an empty full-frame <svg> (viewBox in
        // frame pixels); ctx.content is the headline group. No play(), no repeat: -1, no clocks, no random.
        function signature(tl, at, dur, ctx) {
          /* mi:signature */
        }

        function build() {
          var size = layout();
          var T = P.times;
          var D = P.durations;
          var E = P.eases;
          var tl = gsap.timeline({ paused: true });
          var C = P.choreography;

          ambient(tl);
          words.forEach(function (w, i) {
            tl.fromTo(w, C.from, Object.assign({ duration: D.grow, ease: E.enter }, C.to), T.enter + i * P.stagger);
          });
          // emphasis: up on the brand's emphasis ease, then settle (follow-through), and keep the accent color.
          // layout() left it room for P.emphasisReach.
          tl.to(aw, { scale: P.peak, duration: D.indicate * 0.55, ease: E.emphasis }, T.emphasis);
          tl.to(aw, { scale: 1, duration: D.indicate * 0.45, ease: "power2.out" }, T.emphasis + D.indicate * 0.55);
          tl.to(aw, { color: P.accent.value, duration: D.indicate * 0.5, ease: "power1.out" }, T.emphasis);
          tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: D.draw, ease: E.enter }, T.rule);
          if (P.sub) tl.fromTo(sub, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: D.fade, ease: E.enter }, T.sub);
          // a move on the base ease: the group makes room, the way a scene hands over to the next idea
          tl.fromTo(content, { y: 0 }, { y: -Math.round(sh * (P.signature ? 0.2 : 0.08)), duration: D.move, ease: E.move, immediateRender: false }, T.move);
          if (P.signature) {
            signature(tl, P.signature.start, P.signature.dur, {
              svg: svg, content: content, width: P.width, height: P.height, safe: safe, size: size,
              accent: P.accent.value, eases: E, durations: D
            });
          }
          // exit: together, last word first, faster than the entrance, on the exit ease. The headline travels
          // as one block, so a word that leaves never crosses a word still on screen; each word plays its own
          // part (shrink, turn, fade) in reverse order.
          var away = {};
          var meanWidth = words.reduce(function (s, w) { return s + w.offsetWidth; }, 0) / words.length;
          if (C.away.x || C.away.xPercent) away.x = (C.away.x || 0) + ((C.away.xPercent || 0) / 100) * meanWidth;
          if (C.away.y || C.away.yPercent) away.y = (C.away.y || 0) + ((C.away.yPercent || 0) / 100) * aw.offsetHeight;
          tl.to(head, Object.assign({ duration: P.exitDur + P.exitStagger * (words.length - 1), ease: E.exit }, away), T.exit);
          words.slice().reverse().forEach(function (w, i) {
            tl.to(w, Object.assign({ duration: P.exitDur, ease: E.exit }, C.out), T.exit + i * P.exitStagger);
          });
          tl.to(rule, { scaleX: 0, transformOrigin: "100% 50%", duration: P.exitDur, ease: E.exit }, T.exit);
          if (P.sub) tl.to(sub, { opacity: 0, y: -16, duration: P.exitDur, ease: E.exit }, T.exit);
          if (P.signature) tl.to(svg, { opacity: 0, duration: P.exitDur, ease: E.exit }, T.exit);
          tl.set({}, {}, P.total);
          tl.seek(0, false);

          var key = root.getAttribute("data-composition-id") || "proof";
          window.__timelines = window.__timelines || {};
          window.__timelines[key] = tl;
          if (typeof window.__hfForceTimelineRebind === "function") window.__hfForceTimelineRebind();
        }

        if (document.fonts && document.fonts.ready) {
          void document.body.offsetHeight;
          document.fonts.ready.then(build);
        } else {
          build();
        }
      })();
    </script>
  </body>
</html>
