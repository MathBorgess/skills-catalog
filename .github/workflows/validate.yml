name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check catalog, plugin, and README
        run: node scripts/check-catalog.mjs

      - name: Require a version bump when skills/ changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

  publish:
    name: GitHub Packages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@mathborgess"

      - name: Publish if this version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already on GitHub Packages: ${name}@${version}"
            exit 0
          fi
          npm publish

      - name: Tag the plugin release if this version is new
        run: |
          set -euo pipefail
          name="$(node -p "require('./.claude-plugin/plugin.json').name")"
          version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          tag="${name}--v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "already tagged: ${tag}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm install -g @anthropic-ai/claude-code
          claude plugin tag --push .
