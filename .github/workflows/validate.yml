name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check catalog, plugin, and README
        run: node scripts/check-catalog.mjs
